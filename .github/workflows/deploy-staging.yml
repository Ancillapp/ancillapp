name: Deploy to staging
on:
  push:
    branches:
      - develop
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install deps
        run: yarn install --immutable
      - name: Build
        run: |
          yarn build:functions
          yarn build:sitemap
          yarn build:pwa --mode staging
        env:
          NODE_ENV: staging
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - name: Deploy
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > firebase-service-account.json
          echo "$FIREBASE_FUNCTIONS_DOTENV_BASE64" | base64 --decode > functions/.env.ancillapp-staging
          yarn firebase deploy --project ancillapp-staging --config firebase.json --only hosting:ancillapp-staging,functions:pwa
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64_STAGING }}
          FIREBASE_FUNCTIONS_DOTENV_BASE64: ${{ secrets.FIREBASE_FUNCTIONS_DOTENV_BASE64_STAGING }}
          GOOGLE_APPLICATION_CREDENTIALS: firebase-service-account.json
